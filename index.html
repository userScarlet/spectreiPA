<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spectre iPA</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cheat-menu" id="cheatMenu">
    <div class="window-header" id="dragHeader">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M12 2L2 22h20L12 2z"/>
        </svg>
        Spectre iPA
        <div class="msk-time" id="mskTimeDisplay"></div>
    </div>

    <div class="window-body">
        <div class="sidebar">
            <div class="nav-icon active" data-target="tab-legit" title="Legit">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
        </div>

        <div class="content">
            <div class="tab-pane active" id="tab-legit">
                <div class="columns">
                    <div class="col">
                        <div class="section-title">ESP</div>

                        <div class="row">
                            <label>Box ESP</label>
                            <div class="toggle"></div>
                        </div>
                        <div class="row">
                            <label>Line ESP</label>
                            <div class="toggle"></div>
                        </div>
                        <div class="row">
                            <label>Health / Armor ESP</label>
                            <div class="toggle"></div>
                        </div>
                        <div class="row">
                            <label>Name / Info ESP</label>
                            <div class="toggle"></div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="section-title">Misc</div>
                        <div class="row">
                            <label>MSK Time</label>
                            <div class="toggle" id="toggleMskTime"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
